<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D文物展示系统</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="stylesheet" href="../styles/styles.css">

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
                "three/examples/": "https://unpkg.com/three@0.161.0/examples/jsm/",
                "three/loaders/": "https://unpkg.com/three@0.161.0/examples/jsm/loaders/"
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            overflow-x: hidden;
        }

        /* 主要布局 */
        .viewer-layout {
            display: flex;
            max-width: 1600px;
            margin: 120px auto 20px auto;
            gap: 20px;
            padding: 0 20px;
            height: calc(100vh - 140px);
        }

        /* 左侧边栏 - 相关介绍 */
        .left-sidebar {
            width: 280px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar-title {
            color: #e74c3c;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e74c3c;
        }

        .model-description {
            font-size: 14px;
            line-height: 1.8;
            color: #555;
        }

        .model-description h4 {
            margin: 15px 0 8px 0;
            color: #2c3e50;
            font-size: 15px;
        }

        .model-description p {
            margin: 8px 0;
        }

        .model-meta {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .meta-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 13px;
        }

        .meta-label {
            color: #888;
        }

        .meta-value {
            color: #2c3e50;
            font-weight: 500;
        }

        /* 中间3D展示区域 */
        .center-viewer {
            flex: 1;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            min-width: 0; /* 防止flex item溢出 */
        }

        #renderDiv {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #renderDiv canvas {
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            max-width: 100% !important;
            max-height: 100% !important;
            width: auto !important;
            height: 100% !important;
        }

        #renderDiv video {
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            width: auto !important;
            height: 100% !important;
            object-fit: contain !important;
            transform: translate(-50%, -50%) scaleX(-1) !important;
        }

        .camera-label {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(231, 76, 60, 0.9);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 10;
        }

        .model-switch-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #e74c3c;
            color: #e74c3c;
            padding: 10px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            z-index: 10;
        }

        .model-switch-btn:hover {
            background: #e74c3c;
            color: white;
        }

        /* 右侧边栏 */
        .right-sidebar {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
            margin: 0 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }

        /* AI问答区域 */
        .ai-panel {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 400px;
        }

        .ai-chat-container {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            min-height: 0;
        }

        .ai-messages {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ai-message {
            padding: 12px;
            border-radius: 8px;
            max-width: 85%;
            word-wrap: break-word;
            animation: messageSlide 0.3s ease-out;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ai-message.user {
            background: #4a90e2;
            color: white;
            align-self: flex-end;
            margin-left: auto;
        }

        .ai-message.assistant {
            background: white;
            border: 1px solid #e0e0e0;
            align-self: flex-start;
        }

        .ai-message.system {
            background: #fff3cd;
            border: 1px solid #ffc107;
            align-self: center;
            font-size: 13px;
            text-align: center;
        }

        .ai-message.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .message-content {
            font-size: 13px;
            line-height: 1.6;
        }

        .message-time {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }

        .ai-input-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ai-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            resize: vertical;
            min-height: 80px;
            max-height: 150px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .ai-input:focus {
            outline: none;
            border-color: #4a90e2;
        }

        .ai-submit-btn {
            width: 100%;
            padding: 10px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .ai-submit-btn:hover:not(:disabled) {
            background: #357abd;
        }

        .ai-submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-loading {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-loading::after {
            content: '';
            width: 12px;
            height: 12px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 评论区域 */
        .comments-panel {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 350px;
        }

        .comment-input-area {
            margin-bottom: 15px;
        }

        .comment-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            resize: none;
            font-family: inherit;
        }

        .comment-input:focus {
            outline: none;
            border-color: #4a90e2;
        }

        .comment-submit-btn {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .comment-submit-btn:hover {
            background: #357abd;
        }

        .comments-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .comment-item {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 3px solid #4a90e2;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .comment-author {
            font-weight: 600;
            color: #2c3e50;
            font-size: 13px;
        }

        .comment-time {
            font-size: 12px;
            color: #888;
        }

        .comment-content {
            font-size: 13px;
            line-height: 1.6;
            color: #555;
        }

        .no-comments {
            text-align: center;
            color: #999;
            padding: 30px;
            font-size: 13px;
        }



        /* 模型选择卡片 */
        .model-selection-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            animation: fadeIn 0.3s;
        }

        .model-selection-card {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translate(-50%, -45%);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        .model-selection-card h3 {
            margin: 0 0 20px 0;
            color: #2c3e50;
        }

        .filter-section {
            margin-bottom: 20px;
        }

        .filter-group {
            margin-bottom: 15px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .filter-btn {
            padding: 6px 15px;
            margin: 0 5px 5px 0;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            border-color: #4a90e2;
            color: #4a90e2;
        }

        .filter-btn.active {
            background: #4a90e2;
            color: white;
            border-color: #4a90e2;
        }

        .model-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .model-item {
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .model-item:hover {
            border-color: #4a90e2;
            background: #f0f7ff;
            transform: translateY(-2px);
        }

        .model-item.selected {
            border-color: #4a90e2;
            background: #e3f2fd;
            font-weight: 600;
        }

        .close-btn {
            width: 100%;
            padding: 10px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: #5a6268;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <!-- 顶部导航 -->
    <nav class="museum-nav">
        <div class="nav-container">
            <div class="nav-left">
                <div class="nav-title">
                    <span class="title-icon">🏛️</span>
                    <span>3D数字文物展馆</span>
                </div>
            </div>
            <div class="nav-right">
                <button id="tutorialBtn" class="nav-btn">使用教程</button>
                <button id="settingsBtn" class="nav-btn">系统设置</button>
                <button id="homeBtn" class="nav-btn">返回首页</button>
                <button id="backBtn" class="nav-btn">返回上级</button>
            </div>
        </div>
    </nav>

    <!-- 主要布局 -->
    <div class="viewer-layout">
        <!-- 左侧边栏 - 相关介绍 -->
        <aside class="left-sidebar">
            <h3 class="sidebar-title">相关介绍</h3>
            <div class="model-description" id="modelDescription">
                <p>加载中...</p>
            </div>
        </aside>

        <!-- 中间3D展示区域 -->
        <main class="center-viewer">
            <div id="renderDiv">
                <!--<div class="camera-label">摄像头区域</div>-->
                <button class="model-switch-btn" id="selectModelBtn">切换模型</button>
            </div>
        </main>

        <!-- 右侧边栏 -->
        <aside class="right-sidebar">
            <!-- AI问答区域 -->
            <div class="ai-panel">
                <h3 class="panel-title">🤖 AI文物助手</h3>
                
                <div class="ai-chat-container" id="aiChatContainer">
                    <div class="ai-messages" id="aiMessages">
                        <div class="ai-message system">
                            <div class="message-content">
                                你好！我是AI文物助手，可以回答关于当前文物的任何问题。
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="ai-input-area">
                    <textarea 
                        class="ai-input" 
                        id="aiInput" 
                        placeholder="向AI提问关于这件文物的问题..."
                        rows="3"></textarea>
                    <button class="ai-submit-btn" id="aiSubmitBtn">
                        <span class="btn-text">发送</span>
                        <span class="btn-loading" style="display: none;">思考中...</span>
                    </button>
                </div>
            </div>

            <!-- 评论区域 -->
            <div class="comments-panel">
                <h3 class="panel-title">💬 评论区</h3>
                
                <div class="comment-input-area">
                    <textarea 
                        class="comment-input" 
                        id="commentInput" 
                        placeholder="写下你的评论..."
                        rows="2"></textarea>
                    <button class="comment-submit-btn" id="submitComment">发布评论</button>
                </div>

                <div class="comments-list" id="commentsList">
                    <div class="no-comments">暂无评论，快来抢沙发吧！</div>
                </div>
            </div>
        </aside>
    </div>

    <!-- 模型选择弹窗 -->
    <div class="model-selection-overlay" id="modelSelectionOverlay">
        <div class="model-selection-card">
            <h3>选择文物模型</h3>
            <div class="filter-section">
                <div class="filter-group">
                    <label>朝代筛选：</label>
                    <button class="filter-btn active" data-filter-type="dynasty" data-filter-value="all">全部</button>
                    <button class="filter-btn" data-filter-type="dynasty" data-filter-value="清代">清代</button>
                    <button class="filter-btn" data-filter-type="dynasty" data-filter-value="唐代">唐代</button>
                    <button class="filter-btn" data-filter-type="dynasty" data-filter-value="夏商">夏商</button>
                    <button class="filter-btn" data-filter-type="dynasty" data-filter-value="未知">未知</button>
                </div>
                <div class="filter-group">
                    <label>类别筛选：</label>
                    <button class="filter-btn active" data-filter-type="category" data-filter-value="all">全部</button>
                    <button class="filter-btn" data-filter-type="category" data-filter-value="陶瓷器">陶瓷器</button>
                    <button class="filter-btn" data-filter-type="category" data-filter-value="雕塑">雕塑</button>
                    <button class="filter-btn" data-filter-type="category" data-filter-value="乐器">乐器</button>
                    <button class="filter-btn" data-filter-type="category" data-filter-value="青铜器">青铜器</button>
                    <button class="filter-btn" data-filter-type="category" data-filter-value="科学仪器">科学仪器</button>
                    <button class="filter-btn" data-filter-type="category" data-filter-value="金银器">金银器</button>
                    <button class="filter-btn" data-filter-type="category" data-filter-value="书画">书画</button>
                </div>
            </div>
            <div class="model-list" id="modelList">
                <div class="model-item selected" data-model="teacup.gltf" data-dynasty="清代" data-category="陶瓷器">茶壶</div>
                <div class="model-item" data-model="modelNew.gltf" data-dynasty="唐代" data-category="雕塑">乐舞俑</div>
                <div class="model-item" data-model="egypt_djembe_drum.glb" data-dynasty="未知" data-category="乐器">埃及金贝鼓</div>
                <div class="model-item" data-model="copper-chew.gltf" data-dynasty="夏商" data-category="青铜器">二里头文化青铜器</div>
                <div class="model-item" data-model="armillary_sphere_1771/scene.gltf" data-dynasty="未知" data-category="科学仪器">浑天仪</div>
                <div class="model-item" data-model="ding_censer_with_an_openwork_cover/scene.gltf" data-dynasty="清代" data-category="陶瓷器">鼎式镂空盖香炉</div>
                <div class="model-item" data-model="mass_chalice/scene.gltf" data-dynasty="未知" data-category="金银器">弥撒圣杯</div>
                <div class="model-item" data-model="sculpture_bust_of_roza_loewenfeld/scene.gltf" data-dynasty="未知" data-category="书画">姆萨乌·日姆斯基</div>
            </div>
            <button class="close-btn" id="closeModelCard">关闭</button>
        </div>
    </div>

    <script type="module" src="../scripts/main.js"></script>
    <script type="module" src="../scripts/comments.js"></script>
    <script type="module" src="../scripts/aiAssistant.js"></script>
    <script type="module">
        // 确保渲染器在布局完成后正确调整大小
        window.addEventListener('load', () => {
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
            }, 100);
        });
    </script>
    <script type="module">
        // 获取当前URL参数中的模型路径
        const urlParams = new URLSearchParams(window.location.search);
        const modelParam = urlParams.get('model');
        let currentModelPath = modelParam || 'teacup.gltf';

        // 加载描述数据
        let descriptionsData = {};
        fetch('../data/descriptions.json')
            .then(res => res.json())
            .then(data => {
                descriptionsData = data;
                updateModelInfo(currentModelPath);
            })
            .catch(err => console.error('加载描述数据失败:', err));

        // 更新模型信息
        function updateModelInfo(modelPath) {
            const modelKey = getModelKey(modelPath);
            const modelData = descriptionsData[modelKey];

            if (modelData) {
                // 更新左侧介绍
                const descriptionDiv = document.getElementById('modelDescription');
                descriptionDiv.innerHTML = `
                    <h4>${modelData.title || '未知文物'}</h4>
                    ${modelData.dynasty ? `<div class="model-meta">
                        <div class="meta-item">
                            <span class="meta-label">朝代：</span>
                            <span class="meta-value">${modelData.dynasty}</span>
                        </div>
                    </div>` : ''}
                    ${modelData.year ? `<div class="meta-item">
                        <span class="meta-label">年代：</span>
                        <span class="meta-value">${modelData.year}</span>
                    </div>` : ''}
                    ${modelData.category ? `<div class="meta-item">
                        <span class="meta-label">类别：</span>
                        <span class="meta-value">${modelData.category}</span>
                    </div>` : ''}
                    <p style="margin-top: 15px; line-height: 1.8;">${modelData.description || '暂无描述信息'}</p>
                `;

                // 更新AI助手的模型数据
                if (window.aiAssistant) {
                    window.aiAssistant.setModelData(modelData);
                }
            }
        }

        // 根据模型路径获取对应的key
        function getModelKey(path) {
            if (path.includes('teacup')) return 'teacup';
            if (path.includes('modelNew')) return 'modelNew';
            if (path.includes('egypt_djembe_drum')) return 'egypt_djembe_drum';
            if (path.includes('copper-chew')) return 'copper-chew';
            if (path.includes('armillary_sphere_1771')) return 'armillary_sphere_1771';
            if (path.includes('ding_censer')) return 'ding_censer_with_an_openwork_cover';
            if (path.includes('mass_chalice')) return 'mass_chalice';
            if (path.includes('sculpture_bust')) return 'sculpture_bust_of_roza_loewenfeld';
            return 'teacup';
        }

        // 模型选择功能
        const selectModelBtn = document.getElementById('selectModelBtn');
        const modelSelectionOverlay = document.getElementById('modelSelectionOverlay');
        const closeModelCard = document.getElementById('closeModelCard');
        const modelItems = document.querySelectorAll('.model-item');

        selectModelBtn.addEventListener('click', () => {
            modelSelectionOverlay.style.display = 'block';
        });

        closeModelCard.addEventListener('click', () => {
            modelSelectionOverlay.style.display = 'none';
        });

        modelSelectionOverlay.addEventListener('click', (e) => {
            if (e.target === modelSelectionOverlay) {
                modelSelectionOverlay.style.display = 'none';
            }
        });

        modelItems.forEach(item => {
            item.addEventListener('click', function() {
                const modelPath = this.getAttribute('data-model');
                
                // 触发模型加载事件
                const event = new CustomEvent('loadNewModel', { 
                    detail: { modelPath: '../assets/' + modelPath }
                });
                window.dispatchEvent(event);
                
                // 更新选中状态
                modelItems.forEach(m => m.classList.remove('selected'));
                this.classList.add('selected');
                
                // 更新模型信息
                currentModelPath = modelPath;
                updateModelInfo(modelPath);
                
                // 关闭弹窗
                modelSelectionOverlay.style.display = 'none';
            });
        });

        // 过滤功能
        const filterBtns = document.querySelectorAll('.filter-btn');
        let currentDynastyFilter = 'all';
        let currentCategoryFilter = 'all';

        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const filterType = this.getAttribute('data-filter-type');
                const filterValue = this.getAttribute('data-filter-value');
                
                if (filterType === 'dynasty') {
                    currentDynastyFilter = filterValue;
                    document.querySelectorAll('.filter-btn[data-filter-type="dynasty"]').forEach(b => {
                        b.classList.remove('active');
                    });
                } else if (filterType === 'category') {
                    currentCategoryFilter = filterValue;
                    document.querySelectorAll('.filter-btn[data-filter-type="category"]').forEach(b => {
                        b.classList.remove('active');
                    });
                }
                
                this.classList.add('active');
                applyFilters();
            });
        });

        function applyFilters() {
            modelItems.forEach(item => {
                const itemDynasty = item.getAttribute('data-dynasty');
                const itemCategory = item.getAttribute('data-category');
                
                const dynastyMatch = currentDynastyFilter === 'all' || itemDynasty === currentDynastyFilter;
                const categoryMatch = currentCategoryFilter === 'all' || itemCategory === currentCategoryFilter;
                
                item.style.display = (dynastyMatch && categoryMatch) ? 'block' : 'none';
            });
        }

        // 监听模型变更事件
        window.addEventListener('modelChanged', (e) => {
            const modelPath = e.detail.modelPath;
            if (modelPath) {
                currentModelPath = modelPath.replace('../assets/', '');
                updateModelInfo(currentModelPath);
                
                // 通知评论系统更新
                if (window.commentManager) {
                    console.log('通知评论系统更新模型路径:', modelPath);
                    window.commentManager.setCurrentModelPath(modelPath);
                }
            }
        });

        // 导航按钮功能
        document.getElementById('tutorialBtn')?.addEventListener('click', () => {
            window.location.href = 'tutorial.html';
        });
        
        document.getElementById('settingsBtn')?.addEventListener('click', () => {
            window.location.href = 'settings.html';
        });
        
        document.getElementById('homeBtn')?.addEventListener('click', () => {
            window.location.href = 'index.html';
        });
        
        document.getElementById('backBtn')?.addEventListener('click', () => {
            window.location.href = 'dynasty.html';
        });
    </script>
</body>
</html>
