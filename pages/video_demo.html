<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>视频演示 - 3D文物展示系统</title>
        <link rel="icon" type="image/png" href="../images/favicon.png">
        <link rel="stylesheet" href="../styles/styles.css">
        <script src="../scripts/videoHelper.js"></script>
    </head>
    <body class="video-demo-page" style="width: 100%; height: 100%; overflow: auto; margin: 0; background: linear-gradient(to bottom, #FFF9E6 0%, #F5F5DC 100%);">
        <!-- 顶部导航 -->
        <nav class="museum-nav">
            <div class="nav-container">
                <div class="nav-left">
                    <div class="nav-title">
                        <span class="title-icon">🏛️</span>
                        <span>3D数字文物展馆</span>
                    </div>
                </div>
                <div class="nav-right">
                    <button id="tutorialBtn" class="nav-btn">使用教程</button>
                    <button id="settingsBtn" class="nav-btn">返回首页</button>
                </div>
            </div>
        </nav>
        
        <div class="welcome-screen" style="justify-content: flex-start; overflow-y: auto; height: auto; min-height: 100vh; padding-top: 120px; padding-bottom: 50px;">
            <div class="welcome-title">🎬 视频演示</div>
            
            <div class="video-container">
                <h2 class="video-title">3D文物展示系统使用演示</h2>
                <video id="demo-video" controls preload="metadata">
                    <source src="../data/视频演示.mov" type="video/mp4">
                    <source src="../data/视频演示.mov" type="video/quicktime">
                    <source src="../data/视频演示.mov" type="video/mov">
                    您的浏览器不支持视频标签。
                </video>
                <div id="error-message">
                    视频加载失败，请检查文件路径或格式是否正确。
                </div>
                <div class="video-controls">
                    <button id="play-button" class="video-button">▶️ 播放</button>
                    <button id="pause-button" class="video-button">⏸️ 暂停</button>
                </div>
            </div>
        </div>
        
        <script>
            // 导航按钮事件
            document.getElementById('settingsBtn').addEventListener('click', function() {
                window.location.href = 'index.html';
            });
            
            document.getElementById('tutorialBtn').addEventListener('click', function() {
                window.location.href = 'tutorial.html';
            });
            
            // 视频控制
            document.addEventListener('DOMContentLoaded', function() {
                const video = document.getElementById('demo-video');
                const playButton = document.getElementById('play-button');
                const pauseButton = document.getElementById('pause-button');
                const errorMessage = document.getElementById('error-message');
                
                // 检查视频加载状态
                video.addEventListener('error', function(e) {
                    console.error('视频加载错误:', e);
                    errorMessage.style.display = 'block';
                });
                
                // 检查视频是否能播放
                video.addEventListener('canplay', function() {
                    console.log('视频已加载，可以播放');
                    errorMessage.style.display = 'none';
                });
                
                // 尝试多种方式加载视频
                function tryLoadVideo() {
                    // 尝试标准方式
                    video.addEventListener('error', function onFirstError() {
                        video.removeEventListener('error', onFirstError);
                        console.log('标准方式加载失败，尝试编码URL');
                        
                        // 尝试编码路径
                        const encodedSrc = encodeURI('../data/视频演示.mov');
                        video.src = encodedSrc;
                        
                        video.addEventListener('error', function onSecondError() {
                            video.removeEventListener('error', onSecondError);
                            console.log('编码URL方式失败，尝试Fetch加载');
                            
                            // 尝试Fetch方式加载
                            loadVideoWithFetch(video, '../data/视频演示.mov');
                        });
                    });
                }
                
                // 如果视频已经有错误，重置并重新尝试
                if (video.error) {
                    video.src = '';
                }
                
                tryLoadVideo();
                
                playButton.addEventListener('click', function() {
                    try {
                        const playPromise = video.play();
                        
                        if (playPromise !== undefined) {
                            playPromise.then(_ => {
                                // 播放成功
                            }).catch(error => {
                                console.error('播放失败:', error);
                                errorMessage.style.display = 'block';
                                errorMessage.textContent = '播放失败，可能是浏览器阻止了自动播放';
                            });
                        }
                    } catch (e) {
                        console.error('播放异常:', e);
                    }
                });
                
                pauseButton.addEventListener('click', function() {
                    video.pause();
                });
            });
        </script>
    </body>
</html>
